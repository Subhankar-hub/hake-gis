# Hake GeoDesk plugin repository — Nginx site (HTTP only)
#
# Deploy path: /opt/hake-geodesk/plugin-server -> <repo>/plugin-server
# Serves ONLY public mirror assets under plugins/ (not sync scripts, logs, .git).
#
# Query strings (e.g. ?hake-geodesk=2026) are ignored for static file lookup.
#
# Future HTTPS: add a second server { listen 443 ssl; ... } block with
# certificates — do not add cert paths until TLS is configured.

server {
    listen 80;
    listen [::]:80;
    server_name plugins.haketech.com localhost;

    # Do not expose the project root; only alias public files.
    # Large plugin packages
    client_max_body_size 1m;
    sendfile on;
    tcp_nopush on;

    # Hide common private paths if somehow requested
    location ~ /\. {
        deny all;
    }

    location = /plugins.xml {
        alias /opt/hake-geodesk/plugin-server/plugins/plugins.xml;
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location = /plugins.xsl {
        alias /opt/hake-geodesk/plugin-server/plugins/plugins.xsl;
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location = /logo.png {
        alias /opt/hake-geodesk/plugin-server/plugins/logo.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location /plugins/ {
        alias /opt/hake-geodesk/plugin-server/plugins/;
        autoindex off;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location = / {
        default_type text/plain;
        return 200 'Hake GeoDesk Plugin Repository\nSee /plugins.xml?hake-geodesk=2026\n';
    }

    location / {
        return 404;
    }
}
